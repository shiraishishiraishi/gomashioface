<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>アザラシフェイス 🦭</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0a1628;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100dvh;
      font-family: -apple-system, sans-serif;
      color: #fff;
    }

    h1 {
      font-size: 1.2rem;
      padding: 14px 0 10px;
    }

    #container {
      position: relative;
      width: 100%;
      max-width: 480px;
      aspect-ratio: 3/4;
      background: #111;
      border-radius: 14px;
      overflow: hidden;
    }

    #video {
      position: absolute;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
    }

    #canvas {
      position: absolute;
      width: 100%;
      height: 100%;
      transform: scaleX(-1);
    }

    #status {
      margin-top: 12px;
      font-size: 0.85rem;
      color: #7ecfff;
      text-align: center;
      padding: 0 20px;
      line-height: 1.5;
      white-space: pre-wrap;
    }

    #btn-start {
      margin-top: 14px;
      padding: 12px 32px;
      background: #1e90ff;
      color: #fff;
      border: none;
      border-radius: 24px;
      font-size: 1rem;
      cursor: pointer;
      display: none;
    }

    #btn-start:active { opacity: 0.75; }
  </style>
</head>
<body>
  <h1>🦭 アザラシフェイス</h1>

  <div id="container">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>
  </div>

  <div id="status">⏳ モデルを読み込み中...</div>
  <button id="btn-start">カメラを起動する</button>

  <script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.14/dist/face-api.js"></script>

  <script>
    const MODEL_URL = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.14/model';
    const video  = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx    = canvas.getContext('2d');
    const status = document.getElementById('status');
    const btn    = document.getElementById('btn-start');

    function setStatus(msg) { status.textContent = msg; }

    // ---- アザラシ画像の読み込み ----
    const sealImg = new Image();
    sealImg.src = 'seal.png';

    // ---- アザラシ画像描画 ----
    function drawSeal(x, y, w, h) {
      ctx.drawImage(sealImg, x, y, w, h);
    }

    // ---- 検出ループ（setTimeout で順番待ち） ----
    let loopRunning = false;

    async function detectLoop() {
      if (!loopRunning) return;

      if (video.readyState >= 2 && video.videoWidth > 0) {
        // canvas のサイズを video に合わせる
        if (canvas.width !== video.videoWidth || canvas.height !== video.videoHeight) {
          canvas.width  = video.videoWidth;
          canvas.height = video.videoHeight;
        }

        try {
          const dets = await faceapi.detectAllFaces(
            video,
            new faceapi.TinyFaceDetectorOptions({ inputSize: 224, scoreThreshold: 0.4 })
          );

          ctx.clearRect(0, 0, canvas.width, canvas.height);

          if (dets.length > 0) {
            setStatus('🦭 × ' + dets.length);
            for (const d of dets) {
              const { x, y, width, height } = d.box;
              const pad = 0.3;
              drawSeal(x - width * pad, y - height * pad, width * (1 + pad * 2), height * (1 + pad * 2));
            }
          } else {
            setStatus('顔を検出中... カメラに顔を向けてください');
          }
        } catch (e) {
          console.error('検出エラー:', e);
        }
      }

      setTimeout(detectLoop, 120); // ~8fps
    }

    // ---- カメラ起動 ----
    async function startCamera() {
      btn.style.display = 'none';
      setStatus('📷 カメラを起動中...');

      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        setStatus('⚠️ このブラウザはカメラに対応していません。\nSafariで開いてください。');
        return;
      }

      if (location.protocol !== 'https:' && location.hostname !== 'localhost') {
        setStatus('⚠️ HTTPSが必要です。\nGitHub PagesのURLで開いてください。');
        btn.style.display = 'inline-block';
        return;
      }

      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } },
          audio: false
        });
        video.srcObject = stream;
        await new Promise(resolve => { video.onloadedmetadata = resolve; });
        await video.play();

        setStatus('顔を検出中...');
        loopRunning = true;
        detectLoop();
      } catch (e) {
        console.error('カメラエラー:', e);
        if (e.name === 'NotAllowedError') {
          setStatus('⚠️ カメラの使用を許可してください。\nSafari設定 → このWebサイト → カメラ: 許可');
        } else if (e.name === 'NotFoundError') {
          setStatus('⚠️ カメラが見つかりません。');
        } else {
          setStatus('⚠️ カメラエラー: ' + e.name + '\n' + e.message);
        }
        btn.style.display = 'inline-block';
        btn.textContent = 'もう一度試す';
      }
    }

    // ---- 初期化 ----
    async function init() {
      try {
        setStatus('⏳ AIモデルを読み込み中...\n（初回は数秒かかります）');
        await faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL);
        setStatus('✅ 準備完了');
        await startCamera();
      } catch (e) {
        console.error('モデル読み込みエラー:', e);
        setStatus('⚠️ モデルの読み込みに失敗しました。\nネットワーク接続を確認して再読み込みしてください。\n\nエラー: ' + e.message);
        btn.textContent = '再読み込み';
        btn.style.display = 'inline-block';
        btn.onclick = () => location.reload();
        return;
      }
    }

    btn.addEventListener('click', startCamera);
    init();
  </script>
</body>
</html>
